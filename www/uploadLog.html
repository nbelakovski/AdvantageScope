<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="prompts.css" />
    <script type="module" src="../bundles/uploadLog.js"></script>
    <title>Upload Log &mdash; AdvantageScope</title>
  </head>

  <body>
    <table>
      <tbody>
        <tr>
          <td class="input" tabindex="-1">
            <input type="file" id="wpilog" accept=".wpilog" multiple />
          </td>
        </tr>
        <tr>
          <td class="info" id="progress">
            Choose a .wpilog file for uploading to the cloud.
          </td>
        </tr>
      </tbody>
    </table>
    <button id="exit" tabindex="-1">
      <img src="symbols/xmark.svg" />
    </button>
    <button id="confirm" tabindex="-1">
      <img src="symbols/checkmark.svg" />
    </button>
  </body>
</html>
