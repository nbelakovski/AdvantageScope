<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.digitaloceanspaces.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="prompts.css" />
    <link rel="stylesheet" href="bulkCloudUpload.css" />
    <script type="module" src="../bundles/bulkCloudUpload.js"></script>
    <title>Bulk Cloud Upload &mdash; AdvantageScope</title>
  </head>

  <body>
    <div class="bulk-upload-container">
      <!-- File picker section -->
      <div class="file-picker-section">
        <label for="files-input" class="file-input-label">Select log files to upload:</label>
        <input type="file" id="files-input" accept=".wpilog,.wpilogxz,.rlog,.log" multiple />
      </div>

      <!-- Drag and drop section -->
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-content">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path fill-rule="evenodd" d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383" />
            <path fill-rule="evenodd" d="M7.646 4.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V14.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708z" />
          </svg>
          <p>Drag and drop log files here</p>
          <p class="drop-zone-hint">or click here to choose files</p>
        </div>
      </div>

      <!-- File list section -->
      <div id="file-list-container" class="file-list-container" hidden>
        <div class="file-list-header">Files to upload:</div>
        <div id="file-list" class="file-list"></div>
      </div>

      <!-- Status message -->
      <div id="status-message" class="status-message"></div>
    </div>

    <button id="exit" tabindex="-1">
      <img src="symbols/xmark.svg" />
    </button>
  </body>
</html>
